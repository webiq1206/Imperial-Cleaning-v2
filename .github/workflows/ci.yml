name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, audits, regression tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Match the Node major used by the isolated review tests.
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Quote delivery, analytics and crawler regression tests
        run: node scripts/check-master-audit.mjs
      - name: Internal link manifest is up to date
        run: |
          npm run links:generate
          if ! git diff --quiet -- data/internal-links.json; then
            echo "::error file=data/internal-links.json::Stale link manifest. Run 'npm run links:generate' and commit the result."
            git diff --stat -- data/internal-links.json
            exit 1
          fi
      - name: Internal link audit
        run: npm run audit:links
      - name: NAP consistency audit
        run: npm run audit:nap
      - name: Build
        run: npm run build
